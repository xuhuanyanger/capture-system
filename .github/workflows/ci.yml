name: host-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset host-test
      - run: cmake --build --preset host-test --parallel 2
      - run: ctest --preset host-test
