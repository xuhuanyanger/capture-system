# Only the local acquisition process publishes. Viewers share the device LAN.
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: false
srt: false
hls: false
webrtc: true
authInternalUsers:
  - user: any
    ips: ['127.0.0.1']
    permissions:
      - action: publish
  - user: any
    permissions:
      - action: read
paths:
  '~^camera[1-5]$': {}
