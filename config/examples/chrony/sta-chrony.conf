# STA synchronises only to the AP over the WiFi hotspot.
server 10.42.0.1 iburst minpoll 0 maxpoll 2 prefer
driftfile /var/lib/chrony/chrony.drift
rtcsync
maxupdateskew 100.0
# Permit clock steps only during initial convergence. Gate acquisition on waitsync.
makestep 1.0 3
logdir /var/log/chrony
leapsectz right/UTC
